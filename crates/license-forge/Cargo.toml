[package]
name = "license-forge"
description = "CLI tool for generating Ed25519-signed software licenses"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
readme = "README.md"
keywords = ["license", "ed25519", "cli", "signing", "generator"]
categories = ["command-line-utilities", "cryptography"]

[[bin]]
name = "license-forge"
path = "src/main.rs"

[dependencies]
license-guard = { workspace = true, features = ["sign"] }
ed25519-dalek.workspace = true
rand.workspace = true
dialoguer.workspace = true
serde.workspace = true
serde_json.workspace = true
toml.workspace = true
base64.workspace = true
hex.workspace = true
chrono.workspace = true
clap.workspace = true
clap_complete = "4"
anyhow.workspace = true
dirs.workspace = true
